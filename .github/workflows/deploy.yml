name: Deploy to droplet

# Every push to main pulls, rebuilds and restarts the bot on the DigitalOcean droplet.
# Required repo secrets: DROPLET_HOST (droplet IP) and DROPLET_SSH_KEY (private deploy key).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up SSH key
        env:
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          mkdir -p ~/.ssh
          # Tolerate keys pasted from Windows (CRLF) or with stray surrounding whitespace.
          printf '%s\n' "$KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::DROPLET_SSH_KEY is not a valid private key. Paste the full output of 'cat ~/.ssh/github_deploy' (including the BEGIN/END lines) into the secret."
            exit 1
          fi
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Pull, build and restart
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.DROPLET_HOST }} 'bash -se' <<'EOF'
          set -euo pipefail
          cd ~/sigprediction
          git fetch origin main
          git reset --hard origin/main
          npm ci
          npm run build
          pm2 restart sigprediction
          pm2 save
          echo "Deployed $(git rev-parse --short HEAD)"
          EOF
