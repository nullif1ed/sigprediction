name: Stop bot on droplet

# One-off: calls the collector's stop API (sets collector_desired=false, so instrumentation.ts
# will not auto-resume it next time anything restarts the process), then DELETES the pm2 process
# (not just "stop") and removes any pm2 startup/resurrect hook, so nothing brings it back up.
on:
  workflow_dispatch: {}

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up SSH key
        env:
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Stop collector properly, then kill pm2 and disable auto-restart
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key root@$HOST "bash -se" <<'INNER'
          set -uo pipefail
          cd ~/sigprediction
          ADMIN=$(grep '^BOT_ADMIN_TOKEN=' .env.local | head -1 | cut -d= -f2- || true)
          echo "Calling stop API (sets collector_desired=false)..."
          curl -s -m 20 -X POST localhost:3000/api/collector -H 'content-type: application/json' -H "x-bot-token: $ADMIN" -d '{"action":"stop"}' || echo "(stop API call timed out/failed, continuing to kill the process anyway)"
          echo
          echo "Deleting pm2 process entirely..."
          pm2 delete sigprediction || true
          pm2 save --force
          echo "Removing any pm2 systemd/cron resurrect hook..."
          pm2 unstartup systemd || true
          systemctl disable pm2-root 2>/dev/null || true
          systemctl stop pm2-root 2>/dev/null || true
          echo "Final check: is anything still listening on :3000?"
          sleep 2
          ss -ltnp | grep ':3000' || echo "nothing listening on :3000"
          pm2 list
          INNER
